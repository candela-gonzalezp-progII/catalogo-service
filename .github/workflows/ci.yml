name: CI

on:
  push:
    branches: [develop, testing, main]
  pull_request:
    branches: [develop, testing, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Permisos del wrapper
        run: chmod +x gradlew

      # Docker 29+ exige API >= 1.44; sin esto Testcontainers no encuentra Docker
      - name: Configurar API de Docker para Testcontainers
        run: echo "api.version=1.44" > ~/.docker-java.properties

      - name: Tests (unitarios + integracion con Testcontainers)
        run: ./gradlew test --no-daemon

      - name: Guardar reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests
          path: build/reports/tests/test
