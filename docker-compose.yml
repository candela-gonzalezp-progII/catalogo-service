services:
  postgres-catalogo:
    image: postgres:16
    container_name: catalogo_db_container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-catalogo_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - catalogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-catalogo_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Servicio completo en contenedor:  docker compose --profile app up -d --build
  # (por defecto solo se levanta la base y el servicio se corre con ./gradlew bootRun)
  catalogo-service:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres-catalogo:5432/${DB_NAME:-catalogo_db}
    ports:
      - "8080:8080"
    depends_on:
      postgres-catalogo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  catalogo_pgdata: