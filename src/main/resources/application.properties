spring.config.import=optional:file:.env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

catedra.base-url=${CATEDRA_BASE_URL:http://192.168.194.250:8090}
catedra.username=${CATEDRA_USERNAME:}
catedra.password=${CATEDRA_PASSWORD:}
catedra.connect-timeout=3s
catedra.read-timeout=10s
catedra.max-attempts=3
catedra.retry-backoff=500ms
catedra.sync-on-startup=${CATEDRA_SYNC_ON_STARTUP:false}

spring.data.redis.repositories.enabled=false