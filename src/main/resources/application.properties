spring.application.name=catalogo-service
server.port=8080
spring.config.import=optional:file:.env

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/test_db}
spring.datasource.username=${DB_USER:test}
spring.datasource.password=${DB_PASSWORD:test}
spring.jpa.hibernate.ddl-auto=validate

catedra.base-url=${CATEDRA_BASE_URL:http://localhost:8080}
catedra.username=${CATEDRA_USERNAME:}
catedra.password=${CATEDRA_PASSWORD:}
catedra.connect-timeout=3s
catedra.read-timeout=10s
catedra.max-attempts=3
catedra.retry-backoff=500ms
catedra.sync-on-startup=${CATEDRA_SYNC_ON_STARTUP:false}
catedra.kafka-enabled=${CATEDRA_KAFKA_ENABLED:false}

spring.data.redis.repositories.enabled=false